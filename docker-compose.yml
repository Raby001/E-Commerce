version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: receipts_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: receipts_user
      POSTGRES_PASSWORD: receipts_pass
      POSTGRES_DB: receipts_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: